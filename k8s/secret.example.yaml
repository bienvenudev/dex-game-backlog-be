# Template only. Copy to k8s/secret.yaml (git-ignored), replace every placeholder,
# then apply it. The keys are environment variable names, so the API reads them
# the same way it reads user secrets locally.
apiVersion: v1
kind: Secret
metadata:
  name: dex-secrets
  namespace: dex
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<postgres password>"
  # Host=postgres is the Service name inside the cluster.
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=dex_game_backlog;Username=postgres;Password=<postgres password>"
  Jwt__Key: "<a long random string, at least 32 characters>"
  Authentication__Users__0__Username: "ben"
  Authentication__Users__0__Password: "<password>"
  Authentication__Users__1__Username: "jane"
  Authentication__Users__1__Password: "<password>"
